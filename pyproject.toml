[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-engine"
version = "0.1.0"
description = "Deterministic evidence ledger and task verification for tool-using assistants"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Evidence Engine contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
